[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infinihash-baas"
version = "0.1.0"
description = "Python SDK for Infinihash Rails (BaaS): invoices, collection, settlement, signed records export."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Infinihash" }]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://onboard.infinihash.com"
"API reference" = "https://rails-api.infinihash.com/api/docs"
Source = "https://github.com/Infinihash/baas-python"

[tool.setuptools.packages.find]
include = ["infinihash_baas*"]
